<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 276 178" width="442" height="285" role="img" aria-label="Bezique: The two combinations worth knowing before you sit down. The bezique is always these two cards; the sequence is the five best trumps, shown here with hearts as trumps.">
