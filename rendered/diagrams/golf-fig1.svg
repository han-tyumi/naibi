<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 276 315" width="442" height="504" role="img" aria-label="Golf: Play onto the waste one rank up or one rank down, suits ignored. The ranks do not wrap in the strict form, so neither corner play below is legal; Putt Putt allows both.">
<title>Play onto the waste one rank up or one rank down, suits ignored. The ranks do not wrap in the strict form, so neither corner play below is legal; Putt Putt allows both.</title>
