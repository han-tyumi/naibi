<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 276 199" width="442" height="318" role="img" aria-label="Bezique: Rank inside a suit is not the usual order: the ace is high and the ten sits second, above the king. Aces and tens are also the only cards worth capturing.">
<title>Rank inside a suit is not the usual order: the ace is high and the ten sits second, above the king. Aces and tens are also the only cards worth capturing.</title>
<rect x="69.0" y="21.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
