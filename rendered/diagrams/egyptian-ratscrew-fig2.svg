<text x="69.0" y="17.0" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Marriage</text>
<text x="69.0" y="82.0" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Tens</text>
<text x="69.0" y="147.0" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Run</text>
<text x="138.0" y="207.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Extras, live only if the table agreed them beforehand.</text>
<text x="138.0" y="219.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">Tens means two cards adding to ten, an ace counting one</text>
<text x="138.0" y="231.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">and court cards nothing; a run wants four in a row, not</text>
<text x="138.0" y="243.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5b6672">three.</text>
