<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 276 255" width="442" height="408" role="img" aria-label="Egyptian Ratscrew: Extras, live only if the table agreed them beforehand. Tens means two cards adding to ten, an ace counting one and court cards nothing; a run wants four in a row, not three.">
<title>Extras, live only if the table agreed them beforehand. Tens means two cards adding to ten, an ace counting one and court cards nothing; a run wants four in a row, not three.</title>
<rect x="69.0" y="21.0" width="30" height="42" rx="3" fill="#ffffff" stroke="#5b6672" stroke-width="1"/>
<text x="84.0" y="46.0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#a4243b">K♦</text>
